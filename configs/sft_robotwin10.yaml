defaults:
  - model: dual_system
  - dataloader: robotwin10_clean50
  - _self_

model:
  video_backbone:
    model_path: ${oc.env:OPENWAM_WAN22_PATH,/mnt/world_foundational/datasets/cscsx_projects/models/Wan2.2-TI2V-5B}
    encoder:
      model_path: ${oc.env:OPENWAM_WAN22_PATH,/mnt/world_foundational/datasets/cscsx_projects/models/Wan2.2-TI2V-5B}
  architecture:
    framework: dual_system
    variant: joint_self_attn
    action_dim: 80
    use_proprioception: true
    state_dim: 80
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: action_sees_video
    video_attention_mask_mode: first_frame_causal
    detach_bridge: false
    idm_video_cond_noise_prob: 0.5

training:
  debug: false
  learning_rate: 1.0e-4
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: null
  max_steps: 30000
  batch_size: 16
  gradient_accumulation_steps: 1
  log_every: 20
  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null
  mixed_precision: bf16
  zero_stage: 2
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: false
  offload_optimizer_device: none
  lambda_video: 1.0
  lambda_action: 1.0
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  output_path: ${oc.env:OPENWAM_SFT_OUTPUT,/media/damoxing/ckp/openwam/robotwin10_sft_8g_bs16_30k}
  save_steps: 2000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1
  finetune_ckpt_path: null
  resume_ckpt_path: null
  dataset_num_workers: 8

project:
  name: openwam
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  seed: 42
  wandb:
    project: openwam-robotwin10-sft
    run_name: null
    entity: null
